  <script>
    const tl = gsap.timeline({ paused: true });

    // Ambient glow pulse ending cleanly before 2.6s
    tl.fromTo(
      ".emblem-bg-glow",
      { scale: 0.8, opacity: 0.6 },
      { scale: 1.35, opacity: 1, duration: 1.3, ease: "sine.inOut", yoyo: true, repeat: 1 },
      0
    );

    // Orbit ring rotation around its exact center
    tl.fromTo(
      ".orbit-ring",
      { rotation: 0, svgOrigin: "50 50" },
      { rotation: 360, svgOrigin: "50 50", duration: 3.0, ease: "none" },
      0
    );

    // Initial badge entrance
    tl.fromTo(
      ".emblem-hero-wrap",
      { scale: 0.92, y: 12 },
      { scale: 1.0, y: 0, duration: 0.8, ease: "power2.out" },
      0
    );

    // Equalizer oscillation using GSAP transformOrigin
    const barScales = [0.4, 0.75, 1.0, 0.7, 0.4];
    for (let i = 1; i <= 5; i++) {
      const sel = `.bar-${i}`;
      tl.fromTo(
        sel,
        { scaleY: barScales[i - 1], transformOrigin: "center center" },
        { scaleY: 1.25 - barScales[i - 1] * 0.35, transformOrigin: "center center", duration: 0.5, ease: "sine.inOut", yoyo: true, repeat: 5 },
        (i - 1) * 0.07
      );
    }

    // Radar arcs pulse
    tl.fromTo(
      ".radar-arc-left, .radar-arc-right",
      { opacity: 0.75, transformOrigin: "center center" },
      { opacity: 1, scale: 1.06, transformOrigin: "center center", duration: 0.65, ease: "sine.inOut", yoyo: true, repeat: 3 },
      0.15
    );

    // Outro transition at 2.6s
    tl.to(
      ".emblem-hero-wrap",
      { scale: 1.05, opacity: 0, y: -20, duration: 0.4, ease: "power2.in" },
      2.6
    );
    tl.to(
      ".emblem-bg-glow",
      { opacity: 0, duration: 0.4, ease: "power2.in" },
      2.6
    );

    window.__timelines["intro-emblem"] = tl;
  </script>
