<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --ground: #000000;
        --ink: #ffffff;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--ground);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-fps="60"
      data-width="1920"
      data-height="1080"
    >
      <div
        id="intro-emblem"
        class="clip"
        data-composition-id="intro-emblem"
        data-composition-src="compositions/intro-emblem.html"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>
      <div
        id="intro-lockup"
        class="clip"
        data-composition-id="intro-lockup"
        data-composition-src="compositions/intro-lockup.html"
        data-start="3"
        data-duration="3"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
      ></div>

      <!-- Synchronized Audio Design -->
      <audio
        id="bgm"
        src="assets/audio/bgm.mp3"
        class="clip"
        data-start="0"
        data-duration="6"
        data-volume="0.4"
        data-fade-in="0.3"
        data-fade-out="0.5"
        data-track-index="1"
      ></audio>
      <audio
        id="sfx-whoosh"
        src="assets/audio/whoosh.mp3"
        class="clip"
        data-start="0.1"
        data-duration="0.6"
        data-volume="0.6"
        data-track-index="2"
      ></audio>
      <audio
        id="sfx-impact"
        src="assets/audio/impact.mp3"
        class="clip"
        data-start="3.0"
        data-duration="1.4"
        data-volume="0.5"
        data-track-index="2"
      ></audio>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = gsap.timeline({ paused: true });
    </script>
  </body>
</html>
